<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 110" width="960" height="110" role="img" aria-label="Footer animado de José Saravia">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <clipPath id="footerClip">
      <rect x="4" y="4" width="952" height="102" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }

    @keyframes waveSlideA {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-480px); }
    }
    @keyframes waveSlideB {
      0% { transform: translateX(-480px); }
      100% { transform: translateX(0px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }

    .wave-a { animation: waveSlideA 9s linear infinite; }
    .wave-b { animation: waveSlideB 13s linear infinite; }
    .s1 { animation: twinkle 2.4s ease-in-out infinite; }
    .s2 { animation: twinkle 3.1s ease-in-out 0.8s infinite; }
    .s3 { animation: twinkle 2.7s ease-in-out 1.4s infinite; }
  </style>

  <g clip-path="url(#footerClip)">
    <rect x="4" y="4" width="952" height="102" fill="#090d16"/>

    <!-- Twinkling Stars -->
    <circle class="s1" cx="88"  cy="26" r="1.8" fill="#22d3ee"/>
    <circle class="s2" cx="215" cy="18" r="1.5" fill="#a855f7"/>
    <circle class="s3" cx="748" cy="20" r="1.8" fill="#ec4899"/>
    <circle class="s1" cx="876" cy="28" r="1.6" fill="#22d3ee"/>

    <!-- Layered Animated Waves (Seamless 480px periodic loop) -->
    <path class="wave-a" fill="url(#waveGrad1)"
      d="M 0 74 Q 120 48, 240 74 T 480 74 T 720 74 T 960 74 T 1200 74 T 1440 74 L 1440 112 L 0 112 Z"/>
    <path class="wave-b" fill="url(#waveGrad2)"
      d="M 0 82 Q 120 60, 240 82 T 480 82 T 720 82 T 960 82 T 1200 82 T 1440 82 L 1440 112 L 0 112 Z"/>

    <!-- Centered Motto -->
    <text x="480" y="36" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#f1f5f9">
      Construyendo interfaces modernas, APIs sólidas y arquitecturas listas para escalar
    </text>
    <text x="480" y="57" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8">
      José Saravia (@SaraviaH)  ·  Full Stack &amp; Mobile Developer
    </text>
  </g>

  <rect x="4" y="4" width="952" height="102" rx="16" fill="none" stroke="url(#lineGlow)" stroke-width="1.3" stroke-opacity="0.55"/>
</svg>
