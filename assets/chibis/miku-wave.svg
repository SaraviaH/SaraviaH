  <ellipse cx="42" cy="66.5" rx="3.8" ry="2" fill="#FDA4AF" opacity="0.75"/>
  <ellipse cx="78" cy="66.5" rx="3.8" ry="2" fill="#FDA4AF" opacity="0.75"/>

  <!-- Cheerful open smile -->
  <path d="M55.5 68.5 Q60 75 64.5 68.5 Z" fill="#F45B7A" stroke="#18222F" stroke-width="1.5" stroke-linejoin="round"/>
