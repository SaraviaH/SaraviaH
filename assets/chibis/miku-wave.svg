  <path d="M101 26 L101 16 L109 14 L109 23" fill="none" stroke="#4FD1C5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="99" cy="26" r="2.5" fill="#4FD1C5"/>
  <circle cx="107" cy="23.5" r="2.5" fill="#4FD1C5"/>

  <!-- Back twin-tails (turquoise) -->
  <path d="M34 48 C18 52, 12 74, 16 96 C21 104, 31 100, 32 88 C33 76, 35 64, 40 56 Z" fill="#38B2AC" stroke="#18222F" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M86 48 C102 52, 108 74, 104 96 C99 104, 89 100, 88 88 C87 76, 85 64, 80 56 Z" fill="#38B2AC" stroke="#18222F" stroke-width="2.2" stroke-linejoin="round"/>
