  <ellipse cx="49" cy="61.5" rx="3" ry="3.2" fill="#38B2AC"/>
  <circle cx="47.6" cy="58.2" r="1.5" fill="#FFFFFF"/>

  <ellipse cx="71" cy="60" rx="4.4" ry="5.2" fill="#18222F"/>
  <ellipse cx="71" cy="61.5" rx="3" ry="3.2" fill="#38B2AC"/>
  <circle cx="69.6" cy="58.2" r="1.5" fill="#FFFFFF"/>

