  <path d="M51 84 L60 93 L69 84" fill="none" stroke="#38B2AC" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="57.5,91 62.5,91 63.5,107 60,111 56.5,107" fill="#38B2AC" stroke="#18222F" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Left arm resting -->
