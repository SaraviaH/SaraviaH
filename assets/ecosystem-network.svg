<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 394" width="920" height="394" role="img" aria-label="Ecosistema tecnológico interconectado de SARAVIAH">
  <defs>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="r1" d="M 105 195 L 265 96 L 460 195 L 655 96 L 815 126"/>
    <path id="r2" d="M 265 294 L 460 195 L 655 294 L 815 264"/>
    <path id="r3" d="M 460 62 L 460 195 L 460 330 L 655 294"/>
    <path id="r4" d="M 815 126 L 655 96 L 265 96 L 105 195"/>
    <path id="r5" d="M 460 330 L 265 294 L 105 195"/>
    <path id="r6" d="M 460 62 L 655 96 L 815 264"/>
  </defs>

  <style>
    .edge { fill: none; stroke: #3b434d; stroke-width: 1.2; opacity: 0.85; }
    .node-bg { fill: #010409; stroke: #3d444d; stroke-width: 1.25; }
    .node-bg-core { fill: #010409; stroke: #2F81F7; stroke-width: 1.35; stroke-opacity: 0.78; }
    .node-bg-learning { fill: #010409; stroke: #3FB950; stroke-width: 1.25; stroke-opacity: 0.72; stroke-dasharray: 4 3; }
    .icon { fill: none; stroke: #8B949E; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .icon-core { fill: none; stroke: #F0F6FC; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .icon-dot { fill: #8B949E; stroke: none; }
    .icon-dot-core { fill: #F0F6FC; stroke: none; }

    .pulse {
      fill: none;
      stroke: #2F81F7;
      stroke-width: 1;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: breath 4.8s ease-in-out infinite;
    }
    .pulse-green { stroke: #3FB950; animation-delay: -3.2s; }
    .pulse-d1 { animation-delay: -1.6s; }
    .pulse-d2 { animation-delay: -3.0s; }

    @keyframes breath {
      0%, 100% { transform: scale(1); opacity: 0; }
      40% { opacity: 0.35; }
      75% { transform: scale(1.24); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 0; }
      .pulses { display: none; }
    }
  </style>

  <!-- Minimal GitHub Dark Surface -->
  <rect x="0.5" y="0.5" width="919" height="393" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Interconnecting Lines -->
  <g>
    <line class="edge" x1="105" y1="195" x2="265" y2="96"/>
    <line class="edge" x1="105" y1="195" x2="265" y2="294"/>
    <line class="edge" x1="265" y1="96"  x2="460" y2="62"/>
    <line class="edge" x1="265" y1="96"  x2="460" y2="195"/>
    <line class="edge" x1="265" y1="294" x2="460" y2="195"/>
    <line class="edge" x1="265" y1="294" x2="460" y2="330"/>
    <line class="edge" x1="460" y1="62"  x2="460" y2="195"/>
    <line class="edge" x1="460" y1="195" x2="460" y2="330"/>
    <line class="edge" x1="460" y1="62"  x2="655" y2="96"/>
    <line class="edge" x1="460" y1="195" x2="655" y2="96"/>
    <line class="edge" x1="460" y1="195" x2="655" y2="294"/>
    <line class="edge" x1="460" y1="330" x2="655" y2="294"/>
    <line class="edge" x1="655" y1="96"  x2="655" y2="294"/>
    <line class="edge" x1="655" y1="96"  x2="815" y2="126"/>
    <line class="edge" x1="655" y1="96"  x2="815" y2="264"/>
    <line class="edge" x1="655" y1="294" x2="815" y2="264"/>
    <line class="edge" x1="815" y1="126" x2="815" y2="264"/>
  </g>

  <!-- Subtle Luminous Pulses Traveling Along Connections -->
  <g class="pulses">
    <circle r="2.2" fill="#2F81F7" filter="url(#dotGlow)">
      <animateMotion dur="9.5s" begin="-1.0s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion>
    </circle>
    <circle r="2.2" fill="#3FB950" filter="url(#dotGlow)">
      <animateMotion dur="8.5s" begin="-3.2s" repeatCount="indefinite"><mpath href="#r2"/></animateMotion>
    </circle>
    <circle r="2.2" fill="#2F81F7" filter="url(#dotGlow)">
      <animateMotion dur="9.0s" begin="-5.4s" repeatCount="indefinite"><mpath href="#r3"/></animateMotion>
    </circle>
    <circle r="2.2" fill="#2F81F7" filter="url(#dotGlow)">
      <animateMotion dur="10.2s" begin="-2.6s" repeatCount="indefinite"><mpath href="#r4"/></animateMotion>
    </circle>
    <circle r="2.2" fill="#3FB950" filter="url(#dotGlow)">
      <animateMotion dur="7.4s" begin="-4.1s" repeatCount="indefinite"><mpath href="#r5"/></animateMotion>
    </circle>
    <circle r="2.2" fill="#3FB950" filter="url(#dotGlow)">
      <animateMotion dur="7.8s" begin="-6.0s" repeatCount="indefinite"><mpath href="#r6"/></animateMotion>
    </circle>
  </g>

  <!-- 10 Pure Minimalist Icon Nodes (No Brand/Tool Labels) -->
  <!-- Design / UX -->
  <g transform="translate(105,195)">
    <title>Diseño y experiencia de usuario</title>
    <circle class="node-bg" r="28"/>
    <g class="icon" transform="translate(-12,-12)">
      <path d="M4.5 4.5l6.2 14.8 2.1-5.6 5.6-2.1L4.5 4.5z"/>
      <circle cx="17.5" cy="17.5" r="2.5"/>
    </g>
  </g>

  <!-- Web Development -->
  <g transform="translate(265,96)">
    <title>Desarrollo web</title>
    <circle class="pulse" r="30"/>
    <circle class="node-bg-core" r="28"/>
    <g class="icon-core" transform="translate(-12,-12)">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
      <circle class="icon-dot-core" cx="6.2" cy="6.5" r="0.7"/>
      <circle class="icon-dot-core" cx="8.7" cy="6.5" r="0.7"/>
    </g>
  </g>

  <!-- Mobile Applications -->
  <g transform="translate(265,294)">
    <title>Desarrollo de aplicaciones</title>
    <circle class="node-bg" r="28"/>
    <g class="icon" transform="translate(-12,-12)">
      <rect x="7" y="2.5" width="10" height="19" rx="2"/>
      <line x1="10.5" y1="18" x2="13.5" y2="18"/>
    </g>
  </g>

  <!-- Version Control -->
  <g transform="translate(460,62)">
    <title>Control de versiones</title>
    <circle class="node-bg" r="28"/>
    <g class="icon" transform="translate(-12,-12)">
      <circle cx="6.5" cy="6" r="2.2"/>
      <circle cx="17.5" cy="6" r="2.2"/>
      <circle cx="6.5" cy="18" r="2.2"/>
      <line x1="6.5" y1="8.2" x2="6.5" y2="15.8"/>
      <path d="M17.5 8.2c0 3.8-3 4.8-11 4.8"/>
    </g>
  </g>

  <!-- Programming Core -->
  <g transform="translate(460,195)">
    <title>Programación</title>
    <circle class="pulse pulse-d1" r="30"/>
    <circle class="node-bg-core" r="28"/>
    <g class="icon-core" transform="translate(-12,-12)">
      <polyline points="8 7 3 12 8 17"/>
      <polyline points="16 7 21 12 16 17"/>
      <line x1="13.5" y1="5.5" x2="10.5" y2="18.5"/>
    </g>
  </g>

  <!-- Software Architecture -->
  <g transform="translate(460,330)">
    <title>Arquitectura de software</title>
    <circle class="node-bg" r="28"/>
    <g class="icon" transform="translate(-12,-12)">
      <rect x="9.5" y="3" width="5" height="4.5" rx="1"/>
      <rect x="3" y="16.5" width="5" height="4.5" rx="1"/>
      <rect x="16" y="16.5" width="5" height="4.5" rx="1"/>
      <path d="M12 7.5v4.5M5.5 16.5v-2.2a2.3 2.3 0 0 1 2.3-2.3h8.4a2.3 2.3 0 0 1 2.3 2.3v2.2"/>
    </g>
  </g>

  <!-- Backend / APIs -->
  <g transform="translate(655,96)">
    <title>Backend y servicios web</title>
    <circle class="pulse pulse-d2" r="30"/>
    <circle class="node-bg-core" r="28"/>
    <g class="icon-core" transform="translate(-12,-12)">
      <rect x="3" y="4" width="18" height="6.5" rx="1.5"/>
      <rect x="3" y="13.5" width="18" height="6.5" rx="1.5"/>
      <circle class="icon-dot-core" cx="6.8" cy="7.25" r="0.8"/>
      <circle class="icon-dot-core" cx="6.8" cy="16.75" r="0.8"/>
      <line x1="11" y1="7.25" x2="17" y2="7.25"/>
      <line x1="11" y1="16.75" x2="17" y2="16.75"/>
    </g>
  </g>

  <!-- Databases -->
  <g transform="translate(655,294)">
    <title>Bases de datos</title>
    <circle class="node-bg" r="28"/>
    <g class="icon" transform="translate(-12,-12)">
      <ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/>
      <path d="M4.5 5.5v13c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8v-13"/>
      <path d="M4.5 12c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8"/>
    </g>
  </g>

  <!-- Cloud & Infrastructure -->
  <g transform="translate(815,126)">
    <title>Infraestructura y servicios en la nube</title>
    <circle class="node-bg" r="28"/>
    <g class="icon" transform="translate(-12,-12)">
      <path d="M7 18.5h10.2a4.3 4.3 0 0 0 .75-8.53A5.8 5.8 0 0 0 6.6 8.35 3.9 3.9 0 0 0 7 18.5z"/>
    </g>
  </g>

  <!-- Cybersecurity (Foundations · Learning) -->
  <g transform="translate(815,264)">
    <title>Ciberseguridad — Fundamentos en aprendizaje</title>
    <circle class="pulse pulse-green" r="30"/>
    <circle class="node-bg-learning" r="28"/>
    <g class="icon" transform="translate(-12,-12)">
      <path d="M12 3l7.2 3v5.6c0 4.55-3.05 8.55-7.2 9.9-4.15-1.35-7.2-5.35-7.2-9.9V6L12 3z"/>
      <path d="M9.5 12.2l1.8 1.8 3.5-3.8"/>
    </g>
  </g>
</svg>
