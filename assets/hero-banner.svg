<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="José Saravia — Full Stack y Mobile Developer">
  <defs>
    <!-- Background & Surface Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111026"/>
    </linearGradient>

    <!-- RGB Neon Gradient matching avatar headphones -->
    <linearGradient id="rgbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a855f7;#ec4899;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#22d3ee;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#22d3ee;#a855f7;#ec4899" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Perspective Grid Pattern -->
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.28"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="4" y="4" width="952" height="292" rx="18"/>
    </clipPath>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatAlt {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes catBlink {
      0%, 91%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes dashOrbit {
      to { stroke-dashoffset: -120; }
    }
    @keyframes pulseDot {
      0% { transform: scale(1); opacity: 0.9; }
      70% { transform: scale(2.4); opacity: 0; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes codePulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes eqBar {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }
    @keyframes driftUp {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.7; }
      100% { transform: translateY(-48px); opacity: 0; }
    }

    .workstation { animation: floatSlow 5.2s ease-in-out infinite; }
    .badge-1 { animation: floatSlow 4.2s ease-in-out infinite; }
    .badge-2 { animation: floatAlt 4.8s ease-in-out infinite; }
    .badge-3 { animation: floatSlow 3.9s ease-in-out 0.6s infinite; }
    .badge-4 { animation: floatAlt 4.5s ease-in-out 0.9s infinite; }
    .cursor { animation: blinkCursor 1.05s steps(1) infinite; }
    .cat-eyes { transform-box: fill-box; transform-origin: center; animation: catBlink 4.6s ease-in-out infinite; }
    .cat-tail { transform-box: fill-box; transform-origin: 0% 85%; animation: tailWag 3.2s ease-in-out infinite; }
    .orbit { stroke-dasharray: 6 8; animation: dashOrbit 14s linear infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: pulseDot 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .code-a { animation: codePulse 2.6s ease-in-out infinite; }
    .code-b { animation: codePulse 2.6s ease-in-out 0.65s infinite; }
    .code-c { animation: codePulse 2.6s ease-in-out 1.3s infinite; }
    .eq { transform-box: fill-box; transform-origin: bottom center; }
    .p1 { animation: driftUp 5.5s linear infinite; }
    .p2 { animation: driftUp 6.8s linear 1.5s infinite; }
    .p3 { animation: driftUp 4.9s linear 2.6s infinite; }
    .p4 { animation: driftUp 6.2s linear 3.4s infinite; }
  </style>

  <!-- Main Card Frame -->
  <g clip-path="url(#cardClip)">
    <rect x="4" y="4" width="952" height="292" fill="url(#bgGrad)"/>
    <rect x="4" y="4" width="952" height="292" fill="url(#techGrid)"/>

    <!-- Ambient Glows -->
    <circle cx="140" cy="60" r="190" fill="url(#glowCyan)"/>
    <circle cx="745" cy="155" r="200" fill="url(#glowViolet)"/>
    <circle cx="880" cy="255" r="150" fill="url(#glowPink)"/>

    <!-- Floating Ambient Particles -->
    <circle class="p1" cx="545" cy="240" r="2.2" fill="#22d3ee"/>
    <circle class="p2" cx="620" cy="260" r="2.6" fill="#a855f7"/>
    <circle class="p3" cx="855" cy="265" r="2" fill="#ec4899"/>
    <circle class="p4" cx="910" cy="210" r="2.3" fill="#22d3ee"/>

    <!-- Top RGB Accent Line -->
    <rect x="4" y="4" width="952" height="3.5" fill="url(#rgbGrad)"/>
  </g>

  <!-- Outer Glowing Border -->
  <rect x="4" y="4" width="952" height="292" rx="18" fill="none" stroke="url(#rgbGrad)" stroke-width="1.6" stroke-opacity="0.7"/>

  <!-- ================= LEFT IDENTITY PANEL ================= -->
  <g>
    <!-- Live Status Pill -->
    <rect x="44" y="30" width="296" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle class="ping" cx="62" cy="44" r="4.5" fill="#10b981"/>
    <circle cx="62" cy="44" r="4.2" fill="#10b981"/>
    <text x="76" y="48.5" class="mono" font-size="11.2" font-weight="600" fill="#94a3b8" letter-spacing="0.8">ONLINE  •  FULL STACK &amp; MOBILE</text>

    <!-- Main Title -->
    <text x="44" y="108" class="sans" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.8">José Saravia</text>

    <!-- Handle & Disciplines -->
    <text x="44" y="138" class="mono" font-size="14.5" font-weight="600" fill="#22d3ee">@SaraviaH</text>
    <text x="136" y="138" class="sans" font-size="14.5" font-weight="500" fill="#94a3b8"> ·  Frontend  ·  Backend  ·  Servidores  ·  Mobile</text>

    <!-- Mini Animated Terminal Box -->
    <g>
      <rect x="44" y="158" width="474" height="90" rx="11" fill="#080c16" fill-opacity="0.92" stroke="#1e293b" stroke-width="1.2"/>
      <!-- Terminal Window Controls -->
      <rect x="44" y="158" width="474" height="23" rx="11" fill="#111827"/>
      <rect x="44" y="170" width="474" height="11" fill="#111827"/>
      <circle cx="61" cy="169.5" r="4.2" fill="#ef4444"/>
      <circle cx="76" cy="169.5" r="4.2" fill="#f59e0b"/>
      <circle cx="91" cy="169.5" r="4.2" fill="#10b981"/>
      <text x="504" y="173" text-anchor="end" class="mono" font-size="10.2" fill="#64748b">saraviah@dev — zsh</text>

      <!-- Terminal Line 1 -->
      <text x="58" y="206" class="mono" font-size="12.5" font-weight="600" fill="#22d3ee">$ whoami</text>
      <text x="132" y="206" class="mono" font-size="12.5" fill="#e2e8f0">→  Ing. de Sistemas · Perú</text>

      <!-- Terminal Line 2 + Blinking Cursor -->
      <text x="58" y="230" class="mono" font-size="12.5" font-weight="600" fill="#a855f7">$ craft</text>
      <text x="132" y="230" class="mono" font-size="12.5" fill="#cbd5e1">→  UI Moderna · APIs · Cloud</text>
      <rect class="cursor" x="342" y="218" width="8.5" height="15" rx="1.5" fill="#22d3ee"/>
    </g>

    <!-- Subtle RGB Equalizer Pulse Bar (Nod to RGB Headphones Avatar) -->
    <g transform="translate(46, 260)">
      <rect class="eq" x="0"   y="2" width="4" height="16" rx="2" fill="#22d3ee" style="animation: eqBar 1.1s ease-in-out 0.0s infinite"/>
      <rect class="eq" x="9"   y="2" width="4" height="16" rx="2" fill="#38bdf8" style="animation: eqBar 1.3s ease-in-out 0.15s infinite"/>
      <rect class="eq" x="18"  y="2" width="4" height="16" rx="2" fill="#60a5fa" style="animation: eqBar 0.95s ease-in-out 0.3s infinite"/>
      <rect class="eq" x="27"  y="2" width="4" height="16" rx="2" fill="#818cf8" style="animation: eqBar 1.2s ease-in-out 0.45s infinite"/>
      <rect class="eq" x="36"  y="2" width="4" height="16" rx="2" fill="#a855f7" style="animation: eqBar 1.05s ease-in-out 0.1s infinite"/>
      <rect class="eq" x="45"  y="2" width="4" height="16" rx="2" fill="#c084fc" style="animation: eqBar 1.35s ease-in-out 0.25s infinite"/>
      <rect class="eq" x="54"  y="2" width="4" height="16" rx="2" fill="#e879f9" style="animation: eqBar 1.0s ease-in-out 0.5s infinite"/>
      <rect class="eq" x="63"  y="2" width="4" height="16" rx="2" fill="#ec4899" style="animation: eqBar 1.25s ease-in-out 0.2s infinite"/>
      <rect class="eq" x="72"  y="2" width="4" height="16" rx="2" fill="#f472b6" style="animation: eqBar 1.15s ease-in-out 0.4s infinite"/>
      <text x="90" y="14" class="mono" font-size="10.8" fill="#64748b">código limpio · arquitectura escalable</text>
    </g>
  </g>

  <!-- ================= RIGHT ANIMATED WORKSTATION + BLACK CAT ================= -->
  <g>
    <!-- Orbital Neon Ring -->
    <ellipse class="orbit" cx="746" cy="176" rx="166" ry="74" fill="none" stroke="url(#rgbGrad)" stroke-width="1.3" stroke-opacity="0.45" transform="rotate(-8 746 176)"/>

    <!-- Floating Workstation + Perched Black Cat -->
    <g class="workstation">
      <!-- Holographic Monitor Glow Shadow -->
      <ellipse cx="746" cy="264" rx="84" ry="9" fill="#22d3ee" fill-opacity="0.16"/>

      <!-- Monitor Stand -->
      <rect x="733" y="230" width="26" height="22" rx="3" fill="#1e293b"/>
      <rect x="704" y="248" width="84" height="8" rx="4" fill="#334155"/>
      <rect x="716" y="250" width="60" height="3" rx="1.5" fill="url(#rgbGrad)"/>

      <!-- Monitor Chassis -->
      <rect x="636" y="102" width="220" height="132" rx="13" fill="#111827" stroke="url(#rgbGrad)" stroke-width="1.8"/>
      <rect x="644" y="110" width="204" height="114" rx="8" fill="url(#screenGrad)"/>

      <!-- IDE Top Bar inside Monitor -->
      <rect x="644" y="110" width="204" height="18" rx="6" fill="#172033"/>
      <circle cx="655" cy="119" r="2.8" fill="#ef4444"/>
      <circle cx="665" cy="119" r="2.8" fill="#f59e0b"/>
      <circle cx="675" cy="119" r="2.8" fill="#10b981"/>
      <rect x="700" y="116" width="64" height="6" rx="3" fill="#334155"/>

      <!-- IDE Sidebar inside Monitor -->
      <rect x="644" y="128" width="38" height="96" fill="#0d1424"/>
      <rect x="651" y="138" width="22" height="4" rx="2" fill="#38bdf8" fill-opacity="0.7"/>
      <rect x="651" y="149" width="16" height="4" rx="2" fill="#475569"/>
      <rect x="651" y="160" width="24" height="4" rx="2" fill="#a855f7" fill-opacity="0.75"/>
      <rect x="651" y="171" width="18" height="4" rx="2" fill="#475569"/>
      <rect x="651" y="182" width="20" height="4" rx="2" fill="#ec4899" fill-opacity="0.75"/>

      <!-- Animated Syntax-Highlighted Code Lines -->
      <g class="code-a">
        <rect x="692" y="137" width="32" height="5" rx="2.5" fill="#c084fc"/>
        <rect x="730" y="137" width="54" height="5" rx="2.5" fill="#38bdf8"/>
        <rect x="790" y="137" width="24" height="5" rx="2.5" fill="#f472b6"/>
      </g>
      <g class="code-b">
        <rect x="702" y="150" width="44" height="5" rx="2.5" fill="#22d3ee"/>
        <rect x="752" y="150" width="70" height="5" rx="2.5" fill="#94a3b8"/>
      </g>
      <g class="code-c">
        <rect x="702" y="163" width="26" height="5" rx="2.5" fill="#f59e0b"/>
        <rect x="734" y="163" width="62" height="5" rx="2.5" fill="#10b981"/>
        <rect x="802" y="163" width="28" height="5" rx="2.5" fill="#a855f7"/>
      </g>
      <g class="code-a">
        <rect x="702" y="176" width="52" height="5" rx="2.5" fill="#e2e8f0"/>
        <rect x="760" y="176" width="42" height="5" rx="2.5" fill="#ec4899"/>
      </g>
      <g class="code-b">
        <rect x="692" y="189" width="20" height="5" rx="2.5" fill="#c084fc"/>
        <rect x="718" y="189" width="46" height="5" rx="2.5" fill="#38bdf8"/>
      </g>

      <!-- Live Telemetry Wave at Bottom of Screen -->
      <rect x="690" y="201" width="148" height="17" rx="4" fill="#0b1324" stroke="#1e293b" stroke-width="0.8"/>
      <polyline points="696,211 710,211 716,205 722,215 729,208 736,211 756,211 763,204 770,215 777,209 784,211 804,211 811,205 818,214 826,211 833,211"
        fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="140" to="0" dur="2.6s" repeatCount="indefinite"/>
      </polyline>

      <!-- Minimalist Black Cat Perched on Top-Right of Monitor (Nod to Avatar!) -->
      <g transform="translate(778, 49)">
        <!-- Gently Swaying Tail -->
        <path class="cat-tail" d="M 55 47 C 72 47, 78 33, 72 22 C 69 17, 64 19, 66 24 C 69 31, 64 41, 52 42" fill="none" stroke="#1b1f33" stroke-width="6.5" stroke-linecap="round"/>
        <path class="cat-tail" d="M 55 47 C 72 47, 78 33, 72 22 C 69 17, 64 19, 66 24 C 69 31, 64 41, 52 42" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.65" stroke-linecap="round"/>

        <!-- Cat Body -->
        <path d="M 12 53 C 10 38, 19 30, 34 30 C 49 30, 58 38, 56 53 Z" fill="#141827" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.75"/>
        <!-- Tiny Paws hanging on monitor edge -->
        <ellipse cx="23" cy="53" rx="6" ry="3.8" fill="#1b1f33" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.65"/>
        <ellipse cx="44" cy="53" rx="6" ry="3.8" fill="#1b1f33" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.65"/>

        <!-- Cat Ears -->
        <polygon points="15,24 19,7 30,19" fill="#141827" stroke="#a855f7" stroke-width="1.2" stroke-linejoin="round"/>
        <polygon points="18,21 20,12 27,19" fill="#ec4899" fill-opacity="0.55"/>
        <polygon points="53,24 49,7 38,19" fill="#141827" stroke="#a855f7" stroke-width="1.2" stroke-linejoin="round"/>
        <polygon points="50,21 48,12 41,19" fill="#ec4899" fill-opacity="0.55"/>

        <!-- Cat Head -->
        <ellipse cx="34" cy="27" rx="19" ry="15" fill="#141827" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8"/>

        <!-- Glowing Blinking Golden Eyes -->
        <g class="cat-eyes" filter="url(#softGlow)">
          <ellipse cx="26.5" cy="26.5" rx="3.4" ry="3.8" fill="#facc15"/>
          <ellipse cx="41.5" cy="26.5" rx="3.4" ry="3.8" fill="#facc15"/>
          <ellipse cx="26.8" cy="26.5" rx="1.2" ry="2.6" fill="#0f172a"/>
          <ellipse cx="41.8" cy="26.5" rx="1.2" ry="2.6" fill="#0f172a"/>
          <circle cx="25.5" cy="25" r="0.9" fill="#ffffff"/>
          <circle cx="40.5" cy="25" r="0.9" fill="#ffffff"/>
        </g>

        <!-- Tiny Cute Nose -->
        <polygon points="32.5,31 35.5,31 34,33" fill="#f472b6"/>
      </g>
    </g>

    <!-- Floating Tech Badges Orbiting Around Workstation -->
    <g class="badge-1">
      <rect x="556" y="72" width="60" height="28" rx="9" fill="#0f172a" stroke="#22d3ee" stroke-width="1.3"/>
      <text x="586" y="90.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#22d3ee">&lt;/&gt;</text>
    </g>

    <g class="badge-2">
      <rect x="548" y="214" width="68" height="28" rx="9" fill="#0f172a" stroke="#a855f7" stroke-width="1.3"/>
      <text x="582" y="232.5" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#c084fc">{ API }</text>
    </g>

    <g class="badge-3">
      <rect x="876" y="132" width="58" height="28" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
      <text x="905" y="150.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#34d399">SRV</text>
    </g>

    <g class="badge-4">
      <rect x="872" y="218" width="60" height="28" rx="9" fill="#0f172a" stroke="#ec4899" stroke-width="1.3"/>
      <text x="902" y="236.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#f472b6">git</text>
    </g>
  </g>
</svg>
